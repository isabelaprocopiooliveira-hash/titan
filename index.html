<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Bomb Maze - Multiplayer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<style>
  :root{
    --bg:#12141c; --panel:#1c2030; --accent:#ff6b3d; --accent2:#3dd9ff;
    --text:#eef0f7; --muted:#8a90ac; --danger:#ff4d5e; --good:#38d976;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{height:100%; margin:0;}
  body{
    background:radial-gradient(circle at 50% 0%, #1b1f30, #0c0e15 70%);
    color:var(--text); font-family:'Segoe UI', Roboto, Arial, sans-serif;
    display:flex; align-items:center; justify-content:center; min-height:100%;
    overflow-x:hidden;
  }
  #app{width:100%; max-width:520px; padding:16px; margin:0 auto;}
  .screen{display:none; animation:fadein .25s ease;}
  .screen.active{display:block;}
  @keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  h1.logo{
    text-align:center; font-size:2rem; letter-spacing:2px; margin:6px 0 18px;
    color:var(--accent); text-shadow:0 0 18px rgba(255,107,61,.5);
  }
  h1.logo span{color:var(--accent2); text-shadow:0 0 18px rgba(61,217,255,.5);}

  .card{
    background:var(--panel); border-radius:16px; padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.35); border:1px solid #2a2f45;
  }
  label{display:block; font-size:.8rem; color:var(--muted); margin:12px 0 4px;}
  input[type=text], input[type=password]{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid #333952;
    background:#12141e; color:var(--text); font-size:1rem; outline:none;
  }
  input:focus{border-color:var(--accent2);}
  button{
    cursor:pointer; border:none; border-radius:10px; font-weight:600;
    font-size:1rem; padding:13px 16px; transition:transform .12s ease, opacity .12s;
  }
  button:active{transform:scale(.96);}
  .btn-primary{
    width:100%; margin-top:18px; background:linear-gradient(135deg, var(--accent), #ff9a5a);
    color:#1a1a1a;
  }
  .btn-secondary{
    width:100%; margin-top:10px; background:transparent; color:var(--accent2);
    border:1px solid #2c3a52;
  }
  .btn-ghost{background:transparent; color:var(--muted); border:1px solid #2c3a52;}
  .error-msg{color:var(--danger); font-size:.85rem; margin-top:10px; min-height:1.1em;}
  .row{display:flex; gap:10px;}
  .row > *{flex:1;}

  /* NAV / HEADER dentro das telas logadas */
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .userchip{display:flex; align-items:center; gap:8px; font-size:.9rem; color:var(--muted);}
  .userchip b{color:var(--text);}
  .iconbtn{background:#232840; color:var(--text); border-radius:10px; padding:8px 12px; font-size:.85rem;}

  /* RANKING */
  table{width:100%; border-collapse:collapse; margin-top:10px;}
  th,td{padding:8px 6px; text-align:left; font-size:.85rem; border-bottom:1px solid #262b40;}
  th{color:var(--muted); font-weight:500;}
  tr.me{background:rgba(61,217,255,.08);}
  .pos{width:28px; color:var(--muted);}

  /* LOBBY */
  .pulse{
    width:70px; height:70px; margin:20px auto; border-radius:50%;
    border:4px solid var(--accent2); border-top-color:transparent;
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .center-text{text-align:center; color:var(--muted); margin-top:10px;}

  /* GAME */
  #gameScreen{max-width:900px;}
  .hud{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-size:.9rem;}
  .hud .me{color:var(--accent2);}
  .hud .opp{color:var(--accent);}
  #canvasWrap{
    width:100%; display:flex; justify-content:center; background:#0a0b12;
    border-radius:14px; border:1px solid #262b40; overflow:hidden; touch-action:none;
  }
  canvas{width:100%; height:auto; display:block; image-rendering:pixelated;}

  /* CONTROLES */
  #controls{
    display:flex; justify-content:space-between; align-items:flex-end; margin-top:16px; gap:10px;
  }
  .dpad{
    display:grid; grid-template-columns:56px 56px 56px; grid-template-rows:56px 56px 56px;
    gap:4px;
  }
  .dpad button{
    background:#20243a; color:var(--accent2); font-size:1.3rem; padding:0; border-radius:12px;
    border:1px solid #2c3a52;
  }
  .dpad button:active, .dpad button.active{background:var(--accent2); color:#0a0b12;}
  .dpad .empty{background:transparent; border:none;}
  #bombBtn{
    width:90px; height:90px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #ff9a5a, var(--accent) 65%);
    color:#1a1a1a; font-weight:800; font-size:1rem; box-shadow:0 6px 18px rgba(255,107,61,.4);
  }
  #bombBtn:active, #bombBtn.active{filter:brightness(1.25);}
  .hint{font-size:.72rem; color:var(--muted); text-align:center; margin-top:8px;}

  #overlay{
    position:fixed; inset:0; background:rgba(6,7,12,.85); display:none;
    align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  #overlay.show{display:flex;}
  .overlay-card{text-align:center; max-width:360px;}
  .overlay-card h2{font-size:1.6rem; margin-bottom:8px;}
  .win{color:var(--good);} .lose{color:var(--danger);} .draw{color:var(--muted);}

  .tabs{display:flex; gap:8px; margin-bottom:14px;}
  .tabs button{flex:1; background:#181b29; color:var(--muted); border:1px solid #262b40;}
  .tabs button.active{background:var(--accent2); color:#0a0b12; border-color:var(--accent2);}

  @media (max-width:400px){
    .dpad{grid-template-columns:48px 48px 48px; grid-template-rows:48px 48px 48px;}
    #bombBtn{width:78px; height:78px;}
  }
</style>
</head>
<body>
<div id="app">

  <h1 class="logo">BOMB<span>MAZE</span></h1>

  <!-- ===== LOGIN ===== -->
  <div id="loginScreen" class="screen active">
    <div class="card">
      <div class="tabs">
        <button id="tabLogin" class="active">Entrar</button>
        <button id="tabRegister">Cadastrar</button>
      </div>

      <div id="loginForm">
        <label>Usuário</label>
        <input type="text" id="loginUser" maxlength="16" placeholder="seu usuário" />
        <label>Senha</label>
        <input type="password" id="loginPass" placeholder="sua senha" />
        <button class="btn-primary" id="btnLogin">Entrar</button>
        <div class="error-msg" id="loginError"></div>
      </div>

      <div id="registerForm" style="display:none;">
        <label>Escolha um usuário</label>
        <input type="text" id="regUser" maxlength="16" placeholder="3 a 16 caracteres" />
        <label>Escolha uma senha</label>
        <input type="password" id="regPass" placeholder="mín. 4 caracteres" />
        <button class="btn-primary" id="btnRegister">Criar conta</button>
        <div class="error-msg" id="regError"></div>
      </div>
    </div>
  </div>

  <!-- ===== MENU / RANKING ===== -->
  <div id="menuScreen" class="screen">
    <div class="topbar">
      <div class="userchip">👤 <b id="meName">-</b></div>
      <button class="iconbtn" id="btnLogout">Sair</button>
    </div>

    <div class="card">
      <button class="btn-primary" id="btnFindMatch">🔎 Procurar Partida (2 jogadores)</button>
      <div id="statsLine" class="center-text"></div>
    </div>

    <div class="card" style="margin-top:14px;">
      <h3 style="margin:0 0 6px;">🏆 Ranking</h3>
      <table>
        <thead><tr><th class="pos">#</th><th>Jogador</th><th>V</th><th>D</th><th>J</th></tr></thead>
        <tbody id="rankingBody"></tbody>
      </table>
    </div>
  </div>

  <!-- ===== LOBBY (procurando partida) ===== -->
  <div id="lobbyScreen" class="screen">
    <div class="card" style="text-align:center;">
      <div class="pulse"></div>
      <div class="center-text">Procurando um oponente...</div>
      <button class="btn-secondary" id="btnCancelQueue">Cancelar</button>
    </div>
  </div>

  <!-- ===== GAME ===== -->
  <div id="gameScreen" class="screen">
    <div class="hud">
      <div class="me">🔵 <span id="hudMe">Você</span></div>
      <div id="hudStatus" class="center-text" style="flex:1;"></div>
      <div class="opp">🔴 <span id="hudOpp">Oponente</span></div>
    </div>
    <div id="canvasWrap">
      <canvas id="gameCanvas" width="600" height="440"></canvas>
    </div>

    <div id="controls">
      <div class="dpad">
        <div class="empty"></div><button id="btnUp">▲</button><div class="empty"></div>
        <button id="btnLeft">◀</button><div class="empty"></div><button id="btnRight">▶</button>
        <div class="empty"></div><button id="btnDown">▼</button><div class="empty"></div>
      </div>
      <button id="bombBtn">💣<br>BOMBA</button>
    </div>
    <div class="hint">Teclado: setas/WASD + espaço &nbsp;|&nbsp; Toque: use os botões &nbsp;|&nbsp; Controle: analógico/D-pad + botão A</div>
  </div>

</div>

<div id="overlay">
  <div class="overlay-card card">
    <h2 id="overlayTitle">Fim de jogo</h2>
    <p id="overlaySub" class="center-text"></p>
    <button class="btn-primary" id="btnBackToMenu">Voltar ao menu</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------- estado global ----------
  let socket = null;
  let currentUser = null;
  let myIndex = null;
  let myName = null, oppName = null;
  let cols = 15, rows = 11;
  let lastState = null;

  const el = (id) => document.getElementById(id);
  function showScreen(id){
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    el(id).classList.add("active");
  }

  // ---------- API helpers ----------
  async function api(path, body){
    const res = await fetch(path, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      credentials: "same-origin",
      body: body ? JSON.stringify(body) : undefined,
    });
    return res.json();
  }
  async function apiGet(path){
    const res = await fetch(path, {credentials:"same-origin"});
    return res.json();
  }

  // ---------- LOGIN / CADASTRO ----------
  el("tabLogin").onclick = () => {
    el("tabLogin").classList.add("active");
    el("tabRegister").classList.remove("active");
    el("loginForm").style.display = "block";
    el("registerForm").style.display = "none";
  };
  el("tabRegister").onclick = () => {
    el("tabRegister").classList.add("active");
    el("tabLogin").classList.remove("active");
    el("registerForm").style.display = "block";
    el("loginForm").style.display = "none";
  };

  el("btnLogin").onclick = async () => {
    el("loginError").textContent = "";
    const username = el("loginUser").value.trim();
    const password = el("loginPass").value;
    if(!username || !password){ el("loginError").textContent = "Preencha usuário e senha."; return; }
    const r = await api("/api/login", {username, password});
    if(r.ok){ afterAuth(r.username); } else { el("loginError").textContent = r.error || "Erro ao entrar."; }
  };

  el("btnRegister").onclick = async () => {
    el("regError").textContent = "";
    const username = el("regUser").value.trim();
    const password = el("regPass").value;
    if(!username || !password){ el("regError").textContent = "Preencha os campos."; return; }
    const r = await api("/api/register", {username, password});
    if(r.ok){ afterAuth(r.username); } else { el("regError").textContent = r.error || "Erro ao cadastrar."; }
  };

  el("btnLogout").onclick = async () => {
    await api("/api/logout");
    if(socket){ socket.disconnect(); socket = null; }
    currentUser = null;
    showScreen("loginScreen");
  };

  async function afterAuth(username){
    currentUser = username;
    el("meName").textContent = username;
    showScreen("menuScreen");
    connectSocket();
    await loadStats();
    await loadRanking();
  }

  async function loadStats(){
    const r = await apiGet("/api/me");
    if(r.ok){
      const u = r.user;
      el("statsLine").textContent = `Vitórias: ${u.wins} · Derrotas: ${u.losses} · Jogos: ${u.games}`;
    }
  }

  async function loadRanking(){
    const r = await apiGet("/api/ranking");
    const body = el("rankingBody");
    body.innerHTML = "";
    if(r.ok){
      r.ranking.forEach((u, i) => {
        const tr = document.createElement("tr");
        if(u.username === currentUser) tr.className = "me";
        tr.innerHTML = `<td class="pos">${i+1}</td><td>${escapeHtml(u.username)}</td><td>${u.wins}</td><td>${u.losses}</td><td>${u.games}</td>`;
        body.appendChild(tr);
      });
    }
  }
  function escapeHtml(s){
    return s.replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  }

  // tenta restaurar sessão ao carregar a página
  (async function tryRestore(){
    const r = await apiGet("/api/me");
    if(r.ok){ await afterAuth(r.user.username); }
  })();

  // ---------- SOCKET.IO ----------
  function connectSocket(){
    if(socket) return;
    socket = io({ transports: ["websocket","polling"] });

    socket.on("match_found", (data) => {
      myIndex = data.player_index;
      myName = data.you;
      oppName = data.opponent;
      cols = data.cols; rows = data.rows;
      el("hudMe").textContent = myName;
      el("hudOpp").textContent = oppName;
      el("hudStatus").textContent = "";
      resizeCanvas();
      showScreen("gameScreen");
    });

    socket.on("queue_waiting", () => { /* já está mostrando o lobby */ });

    socket.on("state", (data) => {
      lastState = data;
      drawGame();
    });

    socket.on("game_over", (data) => {
      const won = data.winner === myName;
      const draw = !data.winner;
      el("overlayTitle").textContent = draw ? "Empate!" : (won ? "Você venceu! 🏆" : "Você perdeu");
      el("overlayTitle").className = draw ? "draw" : (won ? "win" : "lose");
      el("overlaySub").textContent = data.reason ? `Motivo: ${data.reason}` : "";
      el("overlay").classList.add("show");
      loadStats(); loadRanking();
    });
  }

  // ---------- MATCHMAKING ----------
  el("btnFindMatch").onclick = () => {
    showScreen("lobbyScreen");
    socket.emit("join_queue");
  };
  el("btnCancelQueue").onclick = () => {
    socket.emit("leave_queue");
    showScreen("menuScreen");
  };
  el("btnBackToMenu").onclick = () => {
    el("overlay").classList.remove("show");
    showScreen("menuScreen");
    loadStats(); loadRanking();
  };

  // ---------- DESENHO DO JOGO ----------
  const canvas = el("gameCanvas");
  const ctx = canvas.getContext("2d");
  let CELL = 40;

  function resizeCanvas(){
    CELL = Math.floor(Math.min(600/cols, 440/rows));
    canvas.width = CELL * cols;
    canvas.height = CELL * rows;
  }

  function drawGame(){
    if(!lastState) return;
    const {maze, players, bombs, explosions} = lastState;
    ctx.clearRect(0,0,canvas.width, canvas.height);

    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        const v = maze[r][c];
        const x = c*CELL, y = r*CELL;
        if(v === 1){ // parede dura
          ctx.fillStyle = "#3a3f58";
          ctx.fillRect(x,y,CELL,CELL);
          ctx.fillStyle = "#2a2f45";
          ctx.fillRect(x+3,y+3,CELL-6,CELL-6);
        } else if(v === 2){ // parede destrutivel
          ctx.fillStyle = "#0f1018";
          ctx.fillRect(x,y,CELL,CELL);
          ctx.fillStyle = "#c97a3d";
          ctx.fillRect(x+2,y+2,CELL-4,CELL-4);
        } else {
          ctx.fillStyle = ((r+c)%2===0) ? "#14161f" : "#111319";
          ctx.fillRect(x,y,CELL,CELL);
        }
      }
    }

    // bombas
    bombs.forEach(b => {
      const cx = b.x*CELL + CELL/2, cy = b.y*CELL + CELL/2;
      ctx.fillStyle = "#1a1a1a";
      ctx.beginPath();
      ctx.arc(cx, cy, CELL*0.32, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = "#ff6b3d";
      ctx.fillRect(cx-2, cy-CELL*0.42, 4, CELL*0.18);
    });

    // explosoes
    explosions.forEach(e => {
      const x = e.x*CELL, y = e.y*CELL;
      const grad = ctx.createRadialGradient(x+CELL/2,y+CELL/2,2, x+CELL/2,y+CELL/2, CELL*0.6);
      grad.addColorStop(0, "#fff2c8");
      grad.addColorStop(0.5, "#ff9a3d");
      grad.addColorStop(1, "rgba(255,60,30,0)");
      ctx.fillStyle = grad;
      ctx.fillRect(x,y,CELL,CELL);
    });

    // jogadores
    Object.entries(players).forEach(([name, p]) => {
      if(!p.alive) return;
      const isMe = name === myName;
      const cx = p.x*CELL + CELL/2, cy = p.y*CELL + CELL/2;
      ctx.fillStyle = isMe ? "#3dd9ff" : "#ff6b3d";
      ctx.beginPath();
      ctx.arc(cx, cy, CELL*0.34, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = "#0a0b12";
      ctx.font = `${Math.floor(CELL*0.28)}px sans-serif`;
      ctx.textAlign = "center";
      ctx.fillText(isMe ? "🔵" : "🔴", cx, cy+CELL*0.12);
    });

    el("hudStatus").textContent = lastState.status === "finished" ? "Fim de jogo" : "";
  }

  window.addEventListener("resize", () => { if(cols) resizeCanvas(); if(lastState) drawGame(); });

  // ---------- CONTROLE UNIVERSAL DE ENTRADA ----------
  // Estado unificado enviado ao servidor
  const inputState = {up:false, down:false, left:false, right:false, bomb:false};
  let lastSent = "";
  function sendInput(){
    const s = JSON.stringify(inputState);
    if(s !== lastSent && socket && socket.connected){
      socket.emit("input", inputState);
      lastSent = s;
    }
  }
  setInterval(sendInput, 60);

  // --- Teclado ---
  const keyMap = {
    "ArrowUp":"up","KeyW":"up",
    "ArrowDown":"down","KeyS":"down",
    "ArrowLeft":"left","KeyA":"left",
    "ArrowRight":"right","KeyD":"right",
    "Space":"bomb",
  };
  window.addEventListener("keydown", (e) => {
    const k = keyMap[e.code];
    if(k){ inputState[k] = true; e.preventDefault(); }
  });
  window.addEventListener("keyup", (e) => {
    const k = keyMap[e.code];
    if(k){ inputState[k] = false; e.preventDefault(); }
  });

  // --- Toque / mouse (botões na tela, funcionam em qualquer dispositivo) ---
  function bindHold(id, key){
    const btn = el(id);
    const press = (ev) => { inputState[key] = true; btn.classList.add("active"); if(ev) ev.preventDefault(); };
    const release = (ev) => { inputState[key] = false; btn.classList.remove("active"); if(ev) ev.preventDefault(); };
    btn.addEventListener("touchstart", press, {passive:false});
    btn.addEventListener("touchend", release, {passive:false});
    btn.addEventListener("touchcancel", release, {passive:false});
    btn.addEventListener("mousedown", press);
    btn.addEventListener("mouseup", release);
    btn.addEventListener("mouseleave", release);
  }
  bindHold("btnUp","up"); bindHold("btnDown","down");
  bindHold("btnLeft","left"); bindHold("btnRight","right");
  bindHold("bombBtn","bomb");

  // --- Gamepad (controle de PC/console via API padrão do navegador) ---
  function pollGamepad(){
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for(const gp of pads){
      if(!gp) continue;
      const axH = gp.axes[0] || 0, axV = gp.axes[1] || 0;
      const dpadUp = gp.buttons[12] && gp.buttons[12].pressed;
      const dpadDown = gp.buttons[13] && gp.buttons[13].pressed;
      const dpadLeft = gp.buttons[14] && gp.buttons[14].pressed;
      const dpadRight = gp.buttons[15] && gp.buttons[15].pressed;
      const aButton = gp.buttons[0] && gp.buttons[0].pressed;

      const gpUp = dpadUp || axV < -0.5;
      const gpDown = dpadDown || axV > 0.5;
      const gpLeft = dpadLeft || axH < -0.5;
      const gpRight = dpadRight || axH > 0.5;

      // so aplica se o teclado/toque nao estiverem segurando (evita conflito)
      inputState.up = inputState.up || gpUp;
      inputState.down = inputState.down || gpDown;
      inputState.left = inputState.left || gpLeft;
      inputState.right = inputState.right || gpRight;
      inputState.bomb = inputState.bomb || aButton;
      break; // usa o primeiro controle conectado
    }
    requestAnimationFrame(pollGamepad);
  }
  requestAnimationFrame(pollGamepad);

})();
</script>
</body>
</html>
